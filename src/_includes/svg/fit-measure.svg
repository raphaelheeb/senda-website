<svg class="measure" viewBox="0 0 300 440" role="img" aria-labelledby="measure-title" xmlns="http://www.w3.org/2000/svg">
  <title id="measure-title">How to measure: height, inseam with a book, arm length from shoulder to closed fist, shoulder width</title>
  <!-- figure -->
  <g class="measure__body">
    <circle cx="150" cy="64" r="21"/>
    <rect x="143" y="83" width="14" height="16"/>
    <path d="M106,104 Q150,94 194,104 L198,126 L189,230 L111,230 L102,126 Z"/>
    <path d="M111,226 L189,226 L177,412 L157,412 L150,243 L143,412 L123,412 Z"/>
    <path d="M104,106 L95,112 L85,250 L99,252 L111,140 Z"/>
    <path d="M196,106 L205,112 L215,250 L201,252 L189,140 Z"/>
    <circle cx="92" cy="258" r="8"/>
    <circle cx="208" cy="258" r="8"/>
    <ellipse cx="132" cy="415" rx="13" ry="4"/>
    <ellipse cx="168" cy="415" rx="13" ry="4"/>
  </g>
  <!-- floor -->
  <line class="measure__floor" x1="16" y1="420" x2="290" y2="420"/>
  <!-- height -->
  <g class="measure__dim">
    <line class="measure__guide" x1="40" y1="43" x2="146" y2="43"/>
    <line x1="40" y1="43" x2="40" y2="420"/>
    <line x1="34" y1="43" x2="46" y2="43"/><line x1="34" y1="420" x2="46" y2="420"/>
    <text x="30" y="232" transform="rotate(-90 30 232)" text-anchor="middle">Height</text>
  </g>
  <!-- shoulders -->
  <g class="measure__dim">
    <line class="measure__guide" x1="104" y1="104" x2="104" y2="22"/><line class="measure__guide" x1="196" y1="104" x2="196" y2="22"/>
    <line x1="104" y1="26" x2="196" y2="26"/>
    <line x1="104" y1="20" x2="104" y2="32"/><line x1="196" y1="20" x2="196" y2="32"/>
    <text x="150" y="16" text-anchor="middle">Shoulders</text>
  </g>
  <!-- arm: bony point of the shoulder to the centre of the closed fist -->
  <g class="measure__dim">
    <circle class="measure__point" cx="198" cy="106" r="2.5"/>
    <circle class="measure__point" cx="208" cy="258" r="2.5"/>
    <line class="measure__guide" x1="198" y1="106" x2="236" y2="100"/><line class="measure__guide" x1="208" y1="258" x2="246" y2="252"/>
    <line x1="232" y1="100.6" x2="242" y2="252.6"/>
    <text x="252" y="176">Arm</text>
  </g>
  <!-- inseam: floor to the top of a book pulled up firmly -->
  <rect class="measure__book" x="124" y="236" width="52" height="7"/>
  <g class="measure__dim">
    <line class="measure__guide" x1="176" y1="236" x2="282" y2="236"/>
    <line x1="276" y1="236" x2="276" y2="420"/>
    <line x1="270" y1="236" x2="282" y2="236"/><line x1="270" y1="420" x2="282" y2="420"/>
    <text x="266" y="330" transform="rotate(-90 266 330)" text-anchor="middle">Inseam</text>
  </g>
</svg>
